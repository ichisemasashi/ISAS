<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISAS</title>
  <link rel="stylesheet" href="/css/ol.css">
  <style>
    body { font-family: sans-serif; margin: 1.5rem; max-width: 56rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    form button, .toolbar button { margin-top: 1rem; padding: 0.4rem 0.8rem; }
    .select-switch { display: inline-block; margin-right: 0.75rem; }
    .select-switch select { margin-left: 0.35rem; padding: 0.35rem 0.5rem; }
    nav a { margin-right: 0.75rem; }
    .ol-map { width: 100%; height: 32rem; background: #dce4ec; margin: 1rem 0; cursor: grab; }
    .ol-map:active { cursor: grabbing; }
    .toolbar button { margin-right: 0.4rem; }
    .map-actions { margin: 0.85rem 0 0.35rem; padding-top: 0.5rem; border-top: 1px solid #ddd; }
    .map-actions:first-of-type { border-top: none; padding-top: 0; }
    .map-actions-title { margin: 0 0 0.35rem; font-size: 0.95rem; font-weight: 600; }
    .map-actions-note { margin: 0 0 0.35rem; font-size: 0.85rem; color: #555; }
    .paint-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
    .paint-flow form.inline { display: inline; margin: 0; }
    .paint-flow form.inline button { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.4rem 0.8rem 0.4rem 0; vertical-align: middle; }
    .flash { margin: 0.75rem 0; }
    .error { color: #a40000; }
    .ok { color: #0b5; }
    code { user-select: all; }
    .gantt-axis { position: relative; overflow-x: auto; margin: 1rem 0; border: 1px solid #ccc; min-height: 4rem; padding: 0.5rem; }
    .gantt-ticks { position: relative; height: 1.6rem; margin-bottom: 0.4rem; border-bottom: 1px solid #bbb; }
    .gantt-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 0.75rem; color: #444; white-space: nowrap; }
    .gantt-tick::before { content: ""; position: absolute; left: 50%; top: 1.15rem; width: 1px; height: 0.35rem; background: #888; }
    .gantt-plot { position: relative; min-height: 2rem; }
    .gantt-grid { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .gantt-grid-line { position: absolute; background: rgba(0, 0, 0, 0.12); }
    .gantt-grid-line.time-h { top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
    .gantt-grid-line.time-v { left: 0; right: 0; height: 1px; transform: translateY(-50%); }
    .gantt-rows { position: relative; z-index: 1; display: block; }
    .gantt-row { position: relative; display: block; margin: 0.4rem 0; min-height: 1.6rem; }
    .gantt-row.selected button { font-weight: bold; }
    .gantt-bar { background: #1565c0; border-radius: 2px; pointer-events: none; opacity: 0.75; }
    .gantt-axis.gantt-orient-time-v { display: flex; align-items: stretch; overflow: auto; min-height: 22rem; }
    .gantt-orient-time-v .gantt-ticks { flex: 0 0 5.5rem; width: 5.5rem; height: auto; min-height: 20rem; margin: 0 0.4rem 0 0; border-bottom: none; border-right: 1px solid #bbb; }
    .gantt-orient-time-v .gantt-tick { transform: translateY(-50%); left: 0; right: 0.25rem; text-align: right; white-space: normal; }
    .gantt-orient-time-v .gantt-tick::before { left: auto; right: -0.4rem; top: 50%; width: 0.35rem; height: 1px; }
    .gantt-orient-time-v .gantt-plot { display: flex; flex: 1; min-height: 20rem; align-items: stretch; }
    .gantt-orient-time-v .gantt-rows { display: flex; flex: 1; min-height: 20rem; align-items: stretch; }
    .gantt-orient-time-v .gantt-row { flex: 1 1 0; min-width: 5.5rem; margin: 0 0.25rem; min-height: 20rem; }
    .gantt-orient-time-v .gantt-row button { display: block; width: 100%; white-space: normal; font-size: 0.8rem; }
    #gantt-circle { margin: 1rem 0; min-height: 1rem; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    form.inline { display: inline; margin-right: 0.4rem; }
    form.inline button { margin-top: 0; }
    fieldset label { display: inline-block; margin-right: 0.75rem; width: auto; }
    fieldset input[type="checkbox"] { width: auto; margin-right: 0.25rem; }
    .field-ledger-form input[name="area_ha"],
    .field-ledger-form input[name="area_m2"] { width: 50%; max-width: 7rem; }
    .field-ledger-form textarea[name="memo"] {
      width: 100%; min-height: 14rem; line-height: 1.5; font-size: 1rem;
      box-sizing: border-box; padding: 0.4rem;
    }
    .page-lead { margin: 0.5rem 0 1rem; color: #333; max-width: 42rem; line-height: 1.45; }
    .section-title { margin: 1.25rem 0 0.35rem; font-size: 1.1rem; }
    .section-lead { margin: 0 0 0.75rem; color: #555; font-size: 0.95rem; }
    .field-hint { margin: 0.25rem 0 0; font-size: 0.85rem; color: #555; }
    .empty-hint { color: #555; }
    .memo-gantt-link { margin: 0.75rem 0 1rem; padding: 0.65rem 0.75rem; background: #f7f9fc; border: 1px solid #dce3ec; border-radius: 4px; }
    .memo-gantt-summary { margin: 0 0 0.5rem; font-weight: 600; }
    .memo-gantt-link form { margin-top: 0.35rem; }
    .memo-gantt-link select { max-width: 100%; }
    .form-section { margin: 1rem 0 1.5rem; padding-top: 0.25rem; border-top: 1px solid #e0e0e0; }
    .form-section:first-of-type { border-top: none; padding-top: 0; }
    .daily-item { margin: 0.75rem 0; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    .daily-item-title { font-weight: 600; }
    .daily-item-overdue { display: inline-block; padding: 0 0.4rem; border-radius: 3px; background: #c62828; color: #fff; font-size: 0.8rem; font-weight: 600; }
    .daily-item-time { color: #555; font-size: 0.9rem; }
    .works-list form.work-item { margin: 0.5rem 0; padding: 0.55rem 0.65rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
    .works-list form.work-item.selected { border-color: #1565c0; background: #eef5fc; }
    .works-list .work-open-btn { margin-top: 0; font-weight: 600; }
    .work-item-meta { margin: 0.35rem 0 0; color: #555; font-size: 0.9rem; }
    .pick-hint { margin: 1rem 0; padding: 0.85rem 1rem; background: #fff8e6; border: 1px solid #e6d39a; border-radius: 4px; max-width: 40rem; }
    .pick-hint p { margin: 0; line-height: 1.45; }
    .editing-banner { margin: 0 0 0.75rem; padding: 0.55rem 0.75rem; background: #eef5fc; border-left: 4px solid #1565c0; font-weight: 600; }
    .editing-panel { background: #fcfcfc; padding: 0.75rem; border-radius: 4px; }
    .gantt-children { margin: 1.25rem 0; padding: 0.85rem; border: 1px solid #c5d6ea; border-radius: 4px; background: #f7fbff; }
    .child-panel { margin: 1rem 0; }
    .child-add { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border: 1px dashed #8aa7c7; border-radius: 4px; }
    .child-add h4, .child-list h4 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    .child-list { margin-top: 0.75rem; }
    .work-time-item, .checklist-item { margin: 0.65rem 0; padding: 0.55rem 0; border-top: 1px solid #e3eaf2; }
    .btn-primary { background: #1565c0; color: #fff; border: 1px solid #0d47a1; }
    .danger-zone { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid #e0cfcf; }
    .gantt-title-list form { display: inline-block; margin: 0.25rem 0.35rem 0.25rem 0; }
    .gantt-title-item.selected button { font-weight: bold; }
    .gantt-row.selected button { font-weight: bold; }
    .daily-item-user { margin: 0 0 0.25rem; color: #444; font-size: 0.85rem; }
    .bottom-nav {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      background: #f7f7f7;
      border-top: 1px solid #ccc;
      padding: 0.35rem 0.5rem calc(0.35rem + env(safe-area-inset-bottom, 0px));
      gap: 0.35rem;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
    }
    .bottom-nav a {
      flex: 1 1 0;
      text-align: center;
      text-decoration: none;
      color: #222;
      padding: 0.55rem 0.25rem;
      margin-right: 0;
      border-radius: 6px;
      font-weight: 600;
      box-sizing: border-box;
      max-width: 100%;
    }
    .bottom-nav a.current { background: #e8f0fa; color: #0d47a1; }
    @media (max-width: 799.98px) {
      html {
        width: var(--app-width, 100vw);
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0.75rem 0.75rem 4.75rem;
        width: var(--app-width, 100vw);
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
      }
      #app {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
      }
      #app *,
      #app *::before,
      #app *::after {
        box-sizing: border-box;
        max-width: 100%;
      }
      img, video, svg, canvas, iframe {
        height: auto;
      }
      input, textarea, select, button, table, pre, code {
        width: 100%;
        max-width: 100%;
      }
      fieldset input[type="checkbox"],
      form.inline button,
      .toolbar button,
      .select-switch select {
        width: auto;
        max-width: 100%;
      }
      nav a { display: inline-block; margin: 0.2rem 0.45rem 0.2rem 0; }
      .bottom-nav { display: flex; width: var(--app-width, 100%); max-width: 100%; }
      .ol-map { height: 22rem; width: 100%; max-width: 100%; }
      .page-lead, .memo-body, .memo-item { word-break: break-word; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <div id="app">読み込み中</div>
  <script src="/js/main.js"></script>
  <script src="/js/farmmap.js"></script>
  <script src="/js/gantt.js"></script>
</body>
</html>
