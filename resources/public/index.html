<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISAS</title>
  <link rel="stylesheet" href="/css/ol.css">
  <style>
    body { font-family: sans-serif; margin: 1.5rem; max-width: 56rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    form button, .toolbar button { margin-top: 1rem; padding: 0.4rem 0.8rem; }
    nav a { margin-right: 0.75rem; }
    .ol-map { width: 100%; height: 32rem; background: #dce4ec; margin: 1rem 0; cursor: grab; }
    .ol-map:active { cursor: grabbing; }
    .toolbar button { margin-right: 0.4rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.4rem 0.8rem 0.4rem 0; vertical-align: middle; }
    .flash { margin: 0.75rem 0; }
    .error { color: #a40000; }
    .ok { color: #0b5; }
    code { user-select: all; }
    .gantt-axis { position: relative; overflow-x: auto; margin: 1rem 0; border: 1px solid #ccc; min-height: 4rem; padding: 0.5rem; }
    .gantt-ticks { position: relative; height: 1.6rem; margin-bottom: 0.4rem; border-bottom: 1px solid #bbb; }
    .gantt-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 0.75rem; color: #444; white-space: nowrap; }
    .gantt-tick::before { content: ""; position: absolute; left: 50%; top: 1.15rem; width: 1px; height: 0.35rem; background: #888; }
    .gantt-row { position: relative; display: block; margin: 0.4rem 0; min-height: 1.6rem; }
    .gantt-row.selected button { font-weight: bold; }
    .gantt-bar { background: #1565c0; border-radius: 2px; pointer-events: none; opacity: 0.75; }
    #gantt-circle { margin: 1rem 0; min-height: 1rem; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    form.inline { display: inline; margin-right: 0.4rem; }
    form.inline button { margin-top: 0; }
    fieldset label { display: inline-block; margin-right: 0.75rem; width: auto; }
    fieldset input[type="checkbox"] { width: auto; margin-right: 0.25rem; }
  </style>
</head>
<body>
  <div id="app">読み込み中</div>
  <script src="/js/main.js"></script>
  <script src="/js/farmmap.js"></script>
  <script src="/js/gantt.js"></script>
</body>
</html>
