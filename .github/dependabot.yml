version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/bff
    schedule: { interval: weekly, day: monday, time: "01:00", timezone: Asia/Tokyo }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "01:30", timezone: Asia/Tokyo }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "02:00", timezone: Asia/Tokyo }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /apps/bff
    schedule: { interval: weekly, day: monday, time: "02:30", timezone: Asia/Tokyo }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Tokyo }
