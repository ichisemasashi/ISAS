name: Build native release matrix

on:
  workflow_dispatch:
    inputs:
      version: { description: SemVer without v prefix, required: true, type: string }

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.host_os }} ${{ matrix.architecture }} ${{ matrix.service }}
    strategy:
      fail-fast: true
      matrix:
        host_os: [macos, linux, freebsd]
        architecture: [amd64, arm64]
        service: [database, identity, object-queue, app, edge, telemetry]
        exclude:
          - { host_os: linux, architecture: amd64 }
          - { host_os: linux, architecture: arm64 }
        include:
          - { host_os: linux, architecture: x86_64, service: database }
          - { host_os: linux, architecture: x86_64, service: identity }
          - { host_os: linux, architecture: x86_64, service: object-queue }
          - { host_os: linux, architecture: x86_64, service: app }
          - { host_os: linux, architecture: x86_64, service: edge }
          - { host_os: linux, architecture: x86_64, service: telemetry }
          - { host_os: linux, architecture: aarch64, service: database }
          - { host_os: linux, architecture: aarch64, service: identity }
          - { host_os: linux, architecture: aarch64, service: object-queue }
          - { host_os: linux, architecture: aarch64, service: app }
          - { host_os: linux, architecture: aarch64, service: edge }
          - { host_os: linux, architecture: aarch64, service: telemetry }
    runs-on: [self-hosted, ephemeral, "${{ matrix.host_os }}", "${{ matrix.architecture }}"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require native runner identity
        run: test "$(uname -s)" = "$(case '${{ matrix.host_os }}' in macos) echo Darwin;; linux) echo Linux;; freebsd) echo FreeBSD;; esac)"
      - name: Build Web payload once per runner workspace
        if: matrix.service == 'edge'
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - name: Materialize signing key
        env: { NATIVE_ARTIFACT_SIGNING_KEY: "${{ secrets.NATIVE_ARTIFACT_SIGNING_KEY }}" }
        run: umask 077; test -n "$NATIVE_ARTIFACT_SIGNING_KEY"; printf '%s' "$NATIVE_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/native-signing.pem"
      - name: Derive verification key
        run: openssl pkey -in "$RUNNER_TEMP/native-signing.pem" -pubout -out "$RUNNER_TEMP/native-signing.pub"
      - name: Build, sign, attest
        run: |
          ops/native-artifacts/package-native-artifact.sh \
            ops/native-artifacts/native-artifact-contract.json \
            '${{ matrix.host_os }}' '${{ matrix.architecture }}' '${{ matrix.service }}' \
            '${{ inputs.version }}' native-output "$RUNNER_TEMP/native-signing.pem"
      - name: Install and verify on the disposable native host
        env: { ISAS_EPHEMERAL_NATIVE_RUNNER: "YES" }
        run: ops/native-artifacts/verify-native-package.sh '${{ matrix.host_os }}' '${{ inputs.version }}' native-output/*.${{ matrix.host_os == 'linux' && 'deb' || 'pkg' }} "$RUNNER_TEMP/native-signing.pub"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.host_os }}-${{ matrix.architecture }}-${{ matrix.service }}
          path: native-output/*
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Native artifact manifest
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: native-output
      - name: Assemble complete repository-neutral matrix
        run: node ops/native-artifacts/assemble-native-manifest.mjs ops/native-artifacts/native-artifact-contract.json native-output '${{ inputs.version }}' "$GITHUB_SHA" native-artifact-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-artifact-manifest-${{ github.sha }}
          path: native-artifact-manifest.json
          if-no-files-found: error
          retention-days: 90
