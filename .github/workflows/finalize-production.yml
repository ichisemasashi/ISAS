name: Finalize production after bake

on:
  workflow_dispatch:
    inputs:
      build_run_id: { description: Build release once workflow run ID, required: true, type: string }
      release_manifest_s3_uri: { description: Approved release manifest S3 URI, required: true, type: string }
      production_deployment_manifest_s3_uri: { description: OpenTofu production deployment manifest S3 URI, required: true, type: string }
      production_bake_evidence_s3_uri: { description: Approved 24-hour monitoring evidence S3 URI, required: true, type: string }
      tag_authorization_s3_uri: { description: Signed production tag authorization S3 URI, required: true, type: string }

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: production-progressive-delivery
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize stable slot
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-manifest-*
          path: build
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-1 }
      - name: Finalize only after 24-hour 100-percent bake
        env: { AWS_REGION: ap-northeast-1, ISAS_ENVIRONMENT: production, FINALIZE_MIN_AGE_SECONDS: "86400" }
        run: |
          aws s3 cp "${{ inputs.production_deployment_manifest_s3_uri }}" deployment-manifest.json --only-show-errors
          jq -e '.environment == "production" and .jurisdiction == "JP"' deployment-manifest.json
          evidence_bucket=$(jq -er '.storage.ops_evidence_bucket' deployment-manifest.json)
          artifact_set=$(jq -er '.artifact_set_digest | sub("^sha256:";"")' build/build-manifest.json)
          export STATE_URI="s3://$evidence_bucket/releases/$artifact_set.delivery.json"
          case "${{ inputs.release_manifest_s3_uri }}" in s3://*/releases/*.json) ;; *) exit 64 ;; esac
          case "${{ inputs.production_bake_evidence_s3_uri }}" in s3://*/releases/*.json) ;; *) exit 64 ;; esac
          aws s3 cp "${{ inputs.release_manifest_s3_uri }}" release-manifest.json --only-show-errors
          aws s3 cp "${{ inputs.production_bake_evidence_s3_uri }}" production-bake-evidence.json --only-show-errors
          aws s3 cp "$STATE_URI" delivery-state.json --only-show-errors
          node ops/check-production-release.mjs --pre-finalize release-manifest.json build/build-manifest.json delivery-state.json production-bake-evidence.json
          POLL_SECONDS=1 MAX_MONITOR_SECONDS=60 ops/monitor-progressive-delivery.sh 100 0 0 deployment-manifest.json build/build-manifest.json
          ops/progressive-deploy.sh finalize deployment-manifest.json build/build-manifest.json
      - name: Verify final evidence and publish production tag
        env:
          AWS_REGION: ap-northeast-1
          ISAS_GITHUB_ENVIRONMENT: production-release
          ISAS_TAG_AUTHORIZATION_PUBLIC_KEY: ${{ secrets.ISAS_TAG_AUTHORIZATION_PUBLIC_KEY }}
        run: |
          evidence_bucket=$(jq -er '.storage.ops_evidence_bucket' deployment-manifest.json)
          artifact_set=$(jq -er '.artifact_set_digest | sub("^sha256:";"")' build/build-manifest.json)
          aws s3 cp "s3://$evidence_bucket/releases/$artifact_set.delivery.json" delivery-state.json --only-show-errors
          case "${{ inputs.tag_authorization_s3_uri }}" in s3://*/releases/*.authorization.json) ;; *) exit 64 ;; esac
          aws s3 cp "${{ inputs.tag_authorization_s3_uri }}" production-tag-authorization.json --only-show-errors
          printf '%s\n' "$ISAS_TAG_AUTHORIZATION_PUBLIC_KEY" > trusted-tag-authorization.pem
          git fetch --force --tags origin
          ops/create-production-release-tag.sh release-manifest.json build/build-manifest.json delivery-state.json production-bake-evidence.json production-tag-authorization.json trusted-tag-authorization.pem
