name: Build release once

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version (for example v1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign (${{ matrix.component }})
    runs-on: ubuntu-24.04
    environment: staging
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: bff
            dockerfile: apps/bff/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
          - component: migration
            dockerfile: apps/bff/Dockerfile.migration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Require source commit on main
        run: git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/${{ vars.ECR_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/${{ vars.ECR_NAMESPACE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/${{ vars.ECR_NAMESPACE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign image and attest SBOM with AWS KMS
        env:
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/${{ vars.ECR_NAMESPACE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          KMS_KEY_ARN: ${{ vars.ARTIFACT_SIGNING_KEY_ARN }}
        run: |
          cosign public-key --key "awskms:///$KMS_KEY_ARN" > "${{ matrix.component }}.cosign.pub"
          cosign sign --yes --key "awskms:///$KMS_KEY_ARN" "$IMAGE"
          cosign attest --yes --key "awskms:///$KMS_KEY_ARN" --type spdxjson --predicate "${{ matrix.component }}.spdx.json" "$IMAGE"
      - name: Record immutable artifact identity
        env:
          IMAGE_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/${{ vars.ECR_NAMESPACE }}/${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          KMS_KEY_ARN: ${{ vars.ARTIFACT_SIGNING_KEY_ARN }}
        run: |
          key_sha256="sha256:$(sha256sum "${{ matrix.component }}.cosign.pub" | awk '{print $1}')"
          node ops/build-artifact-manifest.mjs fragment "${{ matrix.component }}" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" \
            "${{ matrix.component }}.spdx.json" "${{ matrix.component }}.cosign.pub" "$key_sha256" "$KMS_KEY_ARN" \
            "${{ matrix.component }}.fragment.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.component }}-${{ github.sha }}
          path: |
            ${{ matrix.component }}.fragment.json
            ${{ matrix.component }}.spdx.json
            ${{ matrix.component }}.cosign.pub
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Release artifact manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-${{ github.sha }}
          path: release-fragments
          merge-multiple: true
      - name: Build once manifest
        run: node ops/build-artifact-manifest.mjs bundle release-fragments "${{ inputs.version || github.ref_name }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-manifest-${{ github.sha }}
          path: |
            build-manifest.json
            release-fragments/*.spdx.json
            release-fragments/*.cosign.pub
          if-no-files-found: error
          retention-days: 90
