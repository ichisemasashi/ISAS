name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff:
    name: BFF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.18.0, cache: npm, cache-dependency-path: apps/bff/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: apps/bff
      - run: npm run check
        working-directory: apps/bff
      - run: npm test
        working-directory: apps/bff
      - run: npm audit --audit-level=high
        working-directory: apps/bff

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.18.0 }
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm test && pnpm build
        working-directory: apps/web
      - run: pnpm audit --audit-level high
        working-directory: apps/web

  policy:
    name: Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with: { tofu_version: 1.10.6, tofu_wrapper: false }
      - run: tofu fmt -check -recursive
        working-directory: infra/opentofu
      - run: tofu init -backend=false -input=false && tofu validate
        working-directory: infra/opentofu
      - run: node --test ops/test/*.test.mjs
      - run: node ops/check-ci-policy.mjs
      - run: node ops/docker-retirement/check-docker-retirement.mjs
      - run: sh -n apps/bff/bin/run-migrations.sh ops/*.sh infra/opentofu/scripts/*.sh

  filesystem-security:
    name: Filesystem security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  container:
    name: Container (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: bff
            dockerfile: apps/bff/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
          - component: migration
            dockerfile: apps/bff/Dockerfile.migration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: isas/${{ matrix.component }}:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: isas/${{ matrix.component }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
