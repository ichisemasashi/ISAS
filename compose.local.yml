name: isas-local-integration

x-common: &common
  restart: unless-stopped
  networks: [internal]
  security_opt: [no-new-privileges:true]

x-pgbouncer: &pgbouncer
  <<: *common
  image: docker.io/edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
  depends_on:
    database: { condition: service_healthy }
  environment:
    DB_HOST: database
    DB_PORT: "5432"
    DB_NAME: isas
    POOL_MODE: transaction
    AUTH_TYPE: scram-sha-256
    MAX_CLIENT_CONN: "80"
    SERVER_RESET_QUERY: DISCARD ALL
    # node-postgres also enforces query_timeout; PgBouncer 1.25 does not forward
    # its statement_timeout startup parameter in transaction-pooling mode.
    IGNORE_STARTUP_PARAMETERS: statement_timeout
  read_only: true
  tmpfs:
    - /tmp
    - /etc/pgbouncer:uid=70,gid=70,mode=0750
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d isas -U $$DB_USER"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  caddy:
    image: docker.io/library/caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    networks:
      edge:
      internal:
        aliases: [isas.localhost]
    volumes:
      - ./infra/local/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/tls:/etc/isas/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *common
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  bff:
    <<: *common
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    env_file: ./.local/secrets/runtime.env
    environment:
      NODE_ENV: production
      ISAS_ENV_PROFILE: local-integration
      ISAS_DEPLOYMENT_ID: isas-jp-local-01
      ISAS_JURISDICTION: JP
      ISAS_PUBLIC_ORIGIN: https://isas.localhost:8443
      ISAS_RUNTIME_ADAPTER_MODULE: ./runtime-adapters/local-integration.mjs
      ISAS_HTTP_PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_EXTRA_CA_CERTS: /run/isas/trust/rootCA.pem
      LOCAL_OBJECT_ROOT: /var/lib/isas/objects
      ISAS_DB_P0_HOST: pgbouncer-p0
      ISAS_DB_AUTH_P1_HOST: pgbouncer-auth-p1
      ISAS_DB_P1_HOST: pgbouncer-p1
      ISAS_DB_P2_HOST: pgbouncer-p2
      ISAS_DB_OPS_HOST: pgbouncer-ops
      ISAS_DB_P0_PORT: "5432"
      ISAS_DB_AUTH_P1_PORT: "5432"
      ISAS_DB_P1_PORT: "5432"
      ISAS_DB_P2_PORT: "5432"
      ISAS_DB_OPS_PORT: "5432"
      ISAS_DB_P0_NAME: isas
      ISAS_DB_AUTH_P1_NAME: isas
      ISAS_DB_P1_NAME: isas
      ISAS_DB_P2_NAME: isas
      ISAS_DB_OPS_NAME: isas
      ISAS_DB_P0_USER: p0_user
      ISAS_DB_AUTH_P1_USER: auth_role
      ISAS_DB_P1_USER: app_user
      ISAS_DB_P2_USER: p2_user
      ISAS_DB_OPS_USER: ops_user
      ISAS_DB_P0_SSLMODE: disable
      ISAS_DB_AUTH_P1_SSLMODE: disable
      ISAS_DB_P1_SSLMODE: disable
      ISAS_DB_P2_SSLMODE: disable
      ISAS_DB_OPS_SSLMODE: disable
    volumes:
      - ./.local/secrets:/run/isas/secrets:ro
      - ./.local/objects:/var/lib/isas/objects
      - ./.local/tls/rootCA.pem:/run/isas/trust/rootCA.pem:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      caddy: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
      pgbouncer-p0: { condition: service_healthy }
      pgbouncer-auth-p1: { condition: service_healthy }
      pgbouncer-p1: { condition: service_healthy }
      pgbouncer-p2: { condition: service_healthy }
      pgbouncer-ops: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  database:
    <<: *common
    image: docker.io/imresamu/postgis@sha256:6da75969915039b7356058b4310d43fde88c275ada982c2dfee29da68445ff4d
    shm_size: 512mb
    env_file: ./.local/secrets/runtime.env
    environment:
      POSTGRES_DB: isas
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/database/init:/docker-entrypoint-initdb.d:ro
      - ./apps/bff/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isas"]
      interval: 3s
      timeout: 3s
      retries: 40

  migration:
    <<: *common
    restart: "no"
    build:
      context: .
      dockerfile: infra/local/database/Dockerfile.migration
    env_file: ./.local/secrets/runtime.env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: isas
      DB_USER: postgres
      PGSSLMODE: disable
    depends_on:
      database: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  pgbouncer-p0:
    <<: *pgbouncer
    environment: { DB_HOST: database, DB_PORT: "5432", DB_NAME: isas, DB_USER: p0_user, DB_PASSWORD: "${ISAS_DB_P0_PASSWORD}", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: "40", DEFAULT_POOL_SIZE: "8", SERVER_RESET_QUERY: DISCARD ALL, IGNORE_STARTUP_PARAMETERS: statement_timeout }
  pgbouncer-auth-p1:
    <<: *pgbouncer
    environment: { DB_HOST: database, DB_PORT: "5432", DB_NAME: isas, DB_USER: auth_role, DB_PASSWORD: "${ISAS_DB_AUTH_P1_PASSWORD}", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: "60", DEFAULT_POOL_SIZE: "12", SERVER_RESET_QUERY: DISCARD ALL, IGNORE_STARTUP_PARAMETERS: statement_timeout }
  pgbouncer-p1:
    <<: *pgbouncer
    environment: { DB_HOST: database, DB_PORT: "5432", DB_NAME: isas, DB_USER: app_user, DB_PASSWORD: "${ISAS_DB_P1_PASSWORD}", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: "80", DEFAULT_POOL_SIZE: "16", SERVER_RESET_QUERY: DISCARD ALL, IGNORE_STARTUP_PARAMETERS: statement_timeout }
  pgbouncer-p2:
    <<: *pgbouncer
    environment: { DB_HOST: database, DB_PORT: "5432", DB_NAME: isas, DB_USER: p2_user, DB_PASSWORD: "${ISAS_DB_P2_PASSWORD}", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: "40", DEFAULT_POOL_SIZE: "8", SERVER_RESET_QUERY: DISCARD ALL, IGNORE_STARTUP_PARAMETERS: statement_timeout }
  pgbouncer-ops:
    <<: *pgbouncer
    environment: { DB_HOST: database, DB_PORT: "5432", DB_NAME: isas, DB_USER: ops_user, DB_PASSWORD: "${ISAS_DB_OPS_PASSWORD}", POOL_MODE: transaction, AUTH_TYPE: scram-sha-256, MAX_CLIENT_CONN: "20", DEFAULT_POOL_SIZE: "4", SERVER_RESET_QUERY: DISCARD ALL, IGNORE_STARTUP_PARAMETERS: statement_timeout }

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: ["start-dev", "--import-realm", "--http-relative-path=/oidc", "--health-enabled=true"]
    env_file: ./.local/secrets/runtime.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      LOCAL_OPERATOR_PASSWORD: "${LOCAL_OPERATOR_PASSWORD}"
      KC_HOSTNAME: https://isas.localhost:8443/oidc
      KC_HOSTNAME_ADMIN: https://127.0.0.1:8443/oidc
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infra/local/keycloak/isas-local-realm.json:/opt/keycloak/data/import/isas-local-realm.json:ro
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /oidc/health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  otel-collector:
    <<: *common
    image: docker.io/otel/opentelemetry-collector-contrib@sha256:98274b756324abdb2473fa0c898247a246091e861e61d1548f9be483198eecea
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./infra/local/telemetry/otel.yml:/etc/otel/config.yml:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  prometheus:
    <<: *common
    image: docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/local/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    cap_drop: [ALL]

  jaeger:
    <<: *common
    image: docker.io/jaegertracing/jaeger@sha256:8c593d8048d86334eb52dba26633b6c846b8ecbe5c22905702c932ae97baeb42
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    volumes: ["jaeger_data:/badger"]
    cap_drop: [ALL]

  perses:
    <<: *common
    image: docker.io/persesdev/perses@sha256:a0e34ddaf9d7599d96036611af205b948c1179646844202d869f3bcf3d5d9e9c
    volumes:
      - ./infra/local/telemetry/perses.yml:/etc/perses/config.yaml:ro
      - perses_data:/perses
    cap_drop: [ALL]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  jaeger_data: {}
  perses_data: {}
